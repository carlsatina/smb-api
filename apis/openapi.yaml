openapi: 3.0.0
info:
  title: REST api for Health Records Documentation
  version: 1.0.0
tags:
  - name: User Authentication
    description: User Authentication managing API
  - name: Services or Store Information
    description: API for Services
  - name: Stores
    description: Store settings and management
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserInfo:
      type: object
      required:
        - store_info
      properties:
        id:
          type: integer
          description: The auto-generated id of the book
        full_name:
          type: string
          description: User fullname
        email:
          type: string
          description: User email
        password:
          type: string
          description: User password
        contact_number:
          type: string
          description: user contact number
        status:
          type: integer
          description: User status if active or not
        is_admin:
          type: integer
          description: flag if user is admin or not
        store_info:
          $ref: '#/components/schemas/StoreInfo'
    StoreInfo:
      type: object
      required:
        - store_info
      properties:
        id:
          type: integer
          description: The auto-generated id of the store info
        user_id:
          type: integer
          description: foreign key for user info
        store_name:
          type: string
          description: Name of the store that provides the services
        store_ads:
          type: string
          description: store ads
        store_history:
          type: string
          description: store history
        home_service:
          type: integer
          description: home service
        services:
          $ref: '#/components/schemas/Services'
        contact_number:
          $ref: '#/components/schemas/ContactNumber'
        address:
          $ref: '#/components/schemas/Address'
        status:
          type: integer
          description: status
        decline_reason:
          type: string
          description: decline reason
        logo:
          type: string
          description: logo for the store.
    ContactNumber:
      type: object
      required:
        - store_id
        - contact_no
      properties:
        id:
          type: integer
          description: The auto-generated id of the contact number
        store_id:
          type: integer
          description: store id
        label:
          type: string
          description: phone label
        contact_no:
          type: string
          description: Store Contact number
    Services:
      type: object
      required:
        - store_id
        - category
        - sub_category
      properties:
        id:
          type: integer
          description: The auto-generated id of the contact number
        store_id:
          type: integer
          description: store id
        description:
          type: string
          description: List of services offered.
        category:
          type: string
          description: Main Category
        sub_category:
          type: string
          description: Sub Category
    Address:
      type: object
      required:
        - store_id
        - address
        - city
        - barangay
        - zip_code
      properties:
        id:
          type: integer
          description: The auto-generated id of the contact number
        store_id:
          type: integer
          description: store id
        address:
          type: string
          description: Address of the store/services
        city:
          type: string
          description: City
        barangay:
          type: string
          description: Barangay
        zip_code:
          type: string
          description: Zip Code
    StoreBase:
      type: object
      properties:
        id:
          type: string
          description: Store id
        name:
          type: string
          description: Store name
        timezone:
          type: string
          description: Store timezone
        currency:
          type: string
          description: Store currency code
        allowNegativeStock:
          type: boolean
          description: Allow inventory to go below zero
        lowStockThreshold:
          type: number
          format: float
          description: Default low stock threshold for alerts
        unitOptions:
          type: array
          items:
            type: string
        categoryOptions:
          type: array
          items:
            type: string
        defaultTaxRate:
          type: number
          format: float
          description: Default tax rate percentage
        defaultDiscount:
          type: number
          format: float
          description: Default discount percentage
    Store:
      allOf:
        - $ref: '#/components/schemas/StoreBase'
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    StoreSummary:
      allOf:
        - $ref: '#/components/schemas/StoreBase'
        - type: object
          properties:
            role:
              type: string
              description: User role in the store
            ownerPlanTier:
              type: string
              description: Store owner plan tier
            ownerSubscriptionActive:
              type: boolean
              description: Store owner subscription status
    StoreListResponse:
      type: object
      properties:
        stores:
          type: array
          items:
            $ref: '#/components/schemas/StoreSummary'
    StoreResponse:
      type: object
      properties:
        store:
          $ref: '#/components/schemas/Store'
    StoreCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
        allowNegativeStock:
          type: boolean
        lowStockThreshold:
          type: number
          format: float
        defaultTaxRate:
          type: number
          format: float
        defaultDiscount:
          type: number
          format: float
        unitOptions:
          type: array
          items:
            type: string
        categoryOptions:
          type: array
          items:
            type: string
    StoreUpdateRequest:
      type: object
      properties:
        name:
          type: string
        timezone:
          type: string
        currency:
          type: string
        allowNegativeStock:
          type: boolean
        lowStockThreshold:
          type: number
          format: float
        defaultTaxRate:
          type: number
          format: float
        defaultDiscount:
          type: number
          format: float
        unitOptions:
          type: array
          items:
            type: string
        categoryOptions:
          type: array
          items:
            type: string
    StoreDeleteResponse:
      type: object
      properties:
        storeId:
          type: string
paths:
  /api/v1/auth/login:
    post:
      summary: Login with user email and password
      tags:
        - User Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: integer
                  example: user@email.com
                password:
                  type: string
                  example: pass1234
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  token:
                    type: string
                    example: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: string
        '500':
          description: Internal server error
  /api/v1/auth/register:
    post:
      summary: Register a User
      tags:
        - User Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  example: user@gmail.com
                password:
                  type: string
                  example: pass1234
                verifyPassword:
                  type: string
                  example: pass1234
                full_name:
                  type: string
                  example: fullname
                contact_number:
                  type: string
                  example: contact number
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: string
        '500':
          description: Internal server error
  /api/v1/auth/profile:
    get:
      summary: Get Profile Info
      tags:
        - User Authentication
      responses:
        '200':
          description: Profile Info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfo'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: string
        '500':
          description: Internal server error
  /api/v1/services/:
    post:
      summary: Add store/services info
      tags:
        - Services or Store Information
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
            format: Bearer+Token
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInfo'
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: string
        '500':
          description: Internal server error
  /api/v1/services/search/{value}:
    get:
      summary: Search for a service.
      tags:
        - Services or Store Information
      parameters:
        - in: path
          name: value
          schema:
            type: string
          required: true
          description: text to search for a service.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: string
        '500':
          description: Internal server error
  /api/v1/services/my_services:
    get:
      summary: Get all Services
      tags:
        - Services or Store Information
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
            format: Bearer+Token
          required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StoreInfo'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: string
        '500':
          description: Internal server error
  /api/v1/services/{id}:
    get:
      summary: Get service with ID
      tags:
        - Services or Store Information
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the service to get
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: string
        '500':
          description: Internal server error
    put:
      summary: Edit service with ID
      tags:
        - Services or Store Information
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the service to get
        - in: header
          name: Authorization
          schema:
            type: string
            format: Bearer+Token
          required: true
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: string
        '500':
          description: Internal server error
  /api/v1/services/{id}/approve:
    put:
      summary: Approve service request.
      tags:
        - Services or Store Information
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
            format: Bearer+Token
          required: true
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the service to approved.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: string
        '500':
          description: Internal server error
  /api/v1/services/{id}/decline:
    put:
      summary: Decline service request.
      tags:
        - Services or Store Information
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
            format: Bearer+Token
          required: true
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the service to decline.
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreInfo'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: string
        '500':
          description: Internal server error
  /api/v1/services/{id}/upload:
    put:
      summary: Upload a brand logo or image.
      tags:
        - Services or Store Information
      parameters:
        - in: header
          name: Authorization
          schema:
            type: string
            format: Bearer+Token
          required: true
        - in: path
          name: id
          schema:
            type: integer
          required: true
          description: Numeric ID of the service to upload a logo.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: string
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: string
        '500':
          description: Internal server error
  /api/v1/stores:
    get:
      summary: List stores for the current user
      tags:
        - Stores
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Store list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreListResponse'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
    post:
      summary: Create a store
      tags:
        - Stores
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCreateRequest'
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal server error
  /api/v1/stores/{storeId}:
    patch:
      summary: Update a store
      tags:
        - Stores
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: storeId
          schema:
            type: string
          required: true
          description: Store id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUpdateRequest'
      responses:
        '200':
          description: Store updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '500':
          description: Internal server error
    delete:
      summary: Archive a store
      tags:
        - Stores
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: storeId
          schema:
            type: string
          required: true
          description: Store id
      responses:
        '200':
          description: Store archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreDeleteResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '500':
          description: Internal server error
